# CI: on every push, run all tests (Postgres included), build the image,
# check that it starts, and push it to GHCR tagged with the full commit SHA.
# Pushes to main also move the :main tag, and the deploy-bump job pins the new
# SHA in news-app-platform (CD step 1); the updater there deploys it.
# Runs on GitHub's native ARM runners and builds linux/arm64 only: the server is
# an AWS Graviton (ARM) instance and dev Macs are Apple silicon, so no emulation anywhere.
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    services:
      # Throwaway database for test_postgres_repository.py, which drops and re-migrates its tables.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      # TEMPORARY: prints the github context values once so they can be inspected; remove after.
      - name: Show github context
        run: |
          echo "ref:        ${{ github.ref }}"
          echo "ref_name:   ${{ github.ref_name }}"
          echo "sha:        ${{ github.sha }}"
          echo "event:      ${{ github.event_name }}"
          echo "repository: ${{ github.repository }}"
          echo "actor:      ${{ github.actor }}"
          env | grep ^GITHUB_ | sort
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -ra

  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      # Build into the local Docker engine first, so the smoke test runs the exact image we push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No DATABASE_URL, so the app uses its bundled JSON data and should become ready on its own.
      - name: Smoke test (container starts and reports ready)
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker push --all-tags "$IMAGE"

      - name: Summary
        run: echo "Pushed \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # CD step 1: pin this commit's image in news-app-platform's docker-compose.yml
  # (main only). The updater on the deploy machine notices the new commit there
  # and deploys it. Needs the PLATFORM_REPO_TOKEN secret (fine-grained token,
  # Contents: read and write on news-app-platform only); skipped without it.
  deploy-bump:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
      SVC: ${{ github.event.repository.name }}
    steps:
      - name: Skip without token
        if: env.TOKEN == ''
        run: echo "::warning::PLATFORM_REPO_TOKEN is not set; not pinning the image in news-app-platform"

      - if: env.TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/news-app-platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: platform

      - name: Pin ${{ github.event.repository.name }}:${{ github.sha }}
        if: env.TOKEN != ''
        working-directory: platform
        run: |
          name="${SVC%-svc}"   # articles-svc → articles (the x-articles-image anchor)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Both services may bump at the same moment: on a rejected push, rebase and retry.
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase origin main
            sed -i "s|^\(x-$name-image: &$name-image ghcr.io/[^:]*:\).*|\1$GITHUB_SHA|" docker-compose.yml
            if git diff --quiet; then echo "Already pinned to $GITHUB_SHA"; exit 0; fi
            git commit -q -am "Deploy $SVC ${GITHUB_SHA::7}" -m "Image ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            if git push -q origin HEAD:main; then
              echo "Pinned \`$SVC:$GITHUB_SHA\` in news-app-platform" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git reset -q --hard origin/main
            sleep $((attempt * 3))
          done
          echo "::error::Could not push the bump after 5 attempts"; exit 1
