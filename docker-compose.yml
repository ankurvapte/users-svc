# Dev-only default password; set USERS_DB_PASSWORD in your shell or .env for anything else.
x-users-db-url: &users-db-url postgresql://users:${USERS_DB_PASSWORD:-users-dev-password}@users-db:5432/users

services:
  users-svc:
    build: .
    image: users-svc:local
    ports:
      - "8081:8080"
    environment:
      LOG_LEVEL: INFO
      DEFAULT_PAGE_SIZE: "10"
      MAX_PAGE_SIZE: "50"
      DATABASE_URL: *users-db-url
      SEED_FILE: /app/data/users.json
    depends_on:
      users-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: applies pending migrations, then exits. users-svc starts only if
  # it succeeds, so exactly one process changes the schema, however many replicas run.
  users-migrate:
    build: .
    image: users-svc:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *users-db-url
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      disable: true  # the image's HTTP healthcheck is for the API, not this job

  # Database per service: only users-svc talks to this. No host port is
  # published; use `docker compose exec users-db psql -U users` to look inside.
  users-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users-dev-password}
      POSTGRES_DB: users
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  users-db-data:
