services:
  users-svc:
    build: .
    image: users-svc:local
    ports:
      - "8081:8080"
    environment:
      LOG_LEVEL: INFO
      DEFAULT_PAGE_SIZE: "10"
      MAX_PAGE_SIZE: "50"
    volumes:
      # Persists users.json across restarts until the Postgres adapter lands.
      - users-data:/app/data
    restart: unless-stopped

volumes:
  users-data:
